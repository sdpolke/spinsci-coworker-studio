<!DOCTYPE html>
<!-- @dsCard group="UI Kit — Website" name="Marketing website" subtitle="Full marketing page — hero, agents, stats, demo modal" viewport="1280x740" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpinSci — Marketing Site UI Kit</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--font-ui); color: var(--color-text-primary); background: var(--color-white);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  @keyframes bubbleIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .kit-bubble { animation: bubbleIn 360ms var(--ease-out-expo) both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .reveal { animation: fadeUp 500ms var(--ease-out-expo) both; }
  @media (max-width: 900px) {
    .kit-navlinks, .kit-signin { display: none !important; }
  }
  .modal-overlay { position: fixed; inset: 0; background: rgba(9,19,34,0.45); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; z-index: 100; animation: fadeUp 240ms ease both; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Nav, Hero, Features, PlatformDark, StatBand, Testimonial, Resources, Footer,
      Eyebrow, Button, SpinIcon } = window.SpinSciDesignSystem_529811;

    const DemoModal = ({ onClose }) => {
      const [sent, setSent] = React.useState(false);
      return (
        <div className="modal-overlay" onClick={onClose}>
          <div onClick={e => e.stopPropagation()} style={{ background: "#fff", borderRadius: "var(--radius-xl)",
            boxShadow: "var(--shadow-modal)", padding: 40, width: 460, maxWidth: "90vw" }}>
            {!sent ? (
              <>
                <Eyebrow>Book a demo</Eyebrow>
                <h2 style={{ font: "300 34px/1.05 var(--font-display)", letterSpacing: "-1.1px",
                  color: "var(--color-ink)", margin: "18px 0 8px" }}>See SpinSci on your workflows.</h2>
                <p style={{ font: "400 15px/22px var(--font-ui)", color: "var(--color-text-secondary)", margin: "0 0 24px" }}>
                  Tell us where you work and we'll tailor the walkthrough.</p>
                <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                  {["Work email", "Health system / organization"].map(p => (
                    <input key={p} placeholder={p} style={{ font: "400 15px/1 var(--font-ui)",
                      padding: "14px 16px", borderRadius: "var(--radius-md)", border: "1px solid var(--border-hairline)",
                      outline: "none", color: "var(--color-ink)" }}
                      onFocus={e => e.target.style.borderColor = "var(--color-violet)"}
                      onBlur={e => e.target.style.borderColor = "var(--border-hairline)"} />
                  ))}
                </div>
                <div style={{ display: "flex", gap: 12, marginTop: 24 }}>
                  <Button variant="primary" icon="arrow" onClick={() => setSent(true)}>Request demo</Button>
                  <Button variant="ghost" icon={null} onClick={onClose}>Cancel</Button>
                </div>
              </>
            ) : (
              <div style={{ textAlign: "center", padding: "12px 0" }}>
                <div style={{ width: 56, height: 56, borderRadius: "50%", background: "var(--color-success-bg)",
                  border: "1px solid var(--border-teal)", display: "flex", alignItems: "center", justifyContent: "center",
                  margin: "0 auto 20px" }}>
                  <SpinIcon name="check" size={26} color="var(--color-teal)" />
                </div>
                <h2 style={{ font: "300 30px/1.05 var(--font-display)", letterSpacing: "-1px",
                  color: "var(--color-ink)", margin: "0 0 10px" }}>Request received.</h2>
                <p style={{ font: "400 15px/22px var(--font-ui)", color: "var(--color-text-secondary)", margin: "0 0 24px" }}>
                  A SpinSci specialist will reach out within one business day.</p>
                <Button variant="primary" icon={null} onClick={onClose}>Done</Button>
              </div>
            )}
          </div>
        </div>
      );
    };

    const App = () => {
      const [demo, setDemo] = React.useState(false);
      const open = () => setDemo(true);
      return (
        <div className="ds-scope">
          <Nav onDemo={open} />
          <Hero onDemo={open} />
          <Features />
          <PlatformDark />
          <StatBand onDemo={open} />
          <Testimonial />
          <Resources />
          <Footer />
          {demo && <DemoModal onClose={() => setDemo(false)} />}
        </div>
      );
    };
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
