<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Radius scale" subtitle="4px → pill, incl. asymmetric" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--color-white); font-family: var(--font-ui); }
  .wrap { padding: 26px 32px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .item { text-align: center; }
  .box { height: 64px; background: var(--color-surface); border: 1px solid var(--border-hairline); }
  .box.tl { background: var(--color-violet-light); border-color: var(--border-violet); }
  .tok { font-size: 12px; font-weight: 600; color: var(--color-text-primary); margin-top: 9px; }
  .val { font-size: 11px; color: var(--color-text-secondary); margin-top: 1px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="item"><div class="box" style="border-radius:4px"></div><div class="tok">radius-xs</div><div class="val">4px · tags</div></div>
      <div class="item"><div class="box" style="border-radius:8px"></div><div class="tok">radius-sm</div><div class="val">8px · icon box</div></div>
      <div class="item"><div class="box" style="border-radius:12px"></div><div class="tok">radius-md</div><div class="val">12px · sm card</div></div>
      <div class="item"><div class="box" style="border-radius:16px"></div><div class="tok">radius-lg</div><div class="val">16px · card</div></div>
      <div class="item"><div class="box" style="border-radius:24px"></div><div class="tok">radius-xl</div><div class="val">24px · feature</div></div>
      <div class="item"><div class="box" style="border-radius:16px 16px 32px 32px"></div><div class="tok">radius-2xl</div><div class="val">32px · asym.</div></div>
      <div class="item"><div class="box tl" style="border-radius:100px"></div><div class="tok">radius-pill</div><div class="val">100px · buttons</div></div>
      <div class="item"><div class="box tl" style="border-radius:50%"></div><div class="tok">circle</div><div class="val">icon suffix</div></div>
    </div>
  </div>
</body>
</html>
