<!DOCTYPE html>
<!-- @dsCard group="Components" name="Feature & CTA cards" subtitle="Light feature card + mint CTA panel" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--color-surface); font-family: var(--font-ui); }
  .wrap { padding: 30px 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .card { background: #fff; border: 1px solid var(--border-hairline); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 24px; }
  .ibox { width: 40px; height: 40px; border-radius: var(--radius-sm); background: var(--color-mint-subtle); color: var(--color-teal); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
  .ibox svg { width: 22px; height: 22px; }
  h4 { font: 300 26px/1.05 var(--font-display); letter-spacing: -0.7px; color: var(--color-ink); margin: 0 0 8px; }
  p { font: 400 14px/20px var(--font-ui); color: var(--color-text-secondary); margin: 0; }
  .cta { background: var(--color-success-bg); border: 1px solid var(--border-teal); box-shadow: none; display: flex; flex-direction: column; }
  .cta .pill { margin-top: auto; align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; background: var(--color-navy); color: #fff; border-radius: var(--radius-pill); padding: 10px 16px; font: 600 13px/1 var(--font-ui); }
  .cta .pill svg { width: 13px; height: 13px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="ibox"><svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/></svg></div>
      <h4>Self-scheduling</h4>
      <p>Patients book, reschedule, and confirm without a single call — synced to your EHR in real time.</p>
    </div>
    <div class="card cta">
      <h4 style="font-size:22px">Ready to remove the friction?</h4>
      <p style="margin-bottom:20px">Mint-accent CTA panel for stat grids.</p>
      <span class="pill">Book a demo <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </div>
  </div>
</body>
</html>
