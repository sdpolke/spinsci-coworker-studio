<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="Base-8 grid, 4px micro" viewport="700x280" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--color-white); font-family: var(--font-ui); }
  .wrap { padding: 24px 32px; }
  .scale { display: flex; flex-direction: column; gap: 9px; }
  .item { display: flex; align-items: center; gap: 14px; }
  .bar { height: 14px; background: var(--color-violet); border-radius: 3px; }
  .tok { font-size: 12px; color: var(--color-text-primary); font-weight: 600; width: 78px; flex: none; }
  .val { font-size: 12px; color: var(--color-text-secondary); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="scale">
      <div class="item"><span class="tok">space-1</span><div class="bar" style="width:4px"></div><span class="val">4px</span></div>
      <div class="item"><span class="tok">space-2</span><div class="bar" style="width:8px"></div><span class="val">8px</span></div>
      <div class="item"><span class="tok">space-3</span><div class="bar" style="width:12px"></div><span class="val">12px</span></div>
      <div class="item"><span class="tok">space-4</span><div class="bar" style="width:16px"></div><span class="val">16px</span></div>
      <div class="item"><span class="tok">space-5</span><div class="bar" style="width:24px"></div><span class="val">24px</span></div>
      <div class="item"><span class="tok">space-6</span><div class="bar" style="width:32px"></div><span class="val">32px</span></div>
      <div class="item"><span class="tok">space-8</span><div class="bar" style="width:40px"></div><span class="val">40px</span></div>
      <div class="item"><span class="tok">space-10</span><div class="bar" style="width:48px"></div><span class="val">48px</span></div>
      <div class="item"><span class="tok">space-16</span><div class="bar" style="width:80px"></div><span class="val">80px · section rhythm</span></div>
      <div class="item"><span class="tok">space-20</span><div class="bar" style="width:96px"></div><span class="val">96px · hero</span></div>
    </div>
  </div>
</body>
</html>
