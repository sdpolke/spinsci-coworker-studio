<!DOCTYPE html>
<!-- @dsCard group="Type" name="Display type — Noto Serif" subtitle="Light serif display scale" viewport="700x230" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--color-white); font-family: var(--font-ui); }
  .wrap { padding: 26px 32px; }
  .specimen { display: flex; align-items: baseline; gap: 18px; padding: 12px 0; border-bottom: 1px solid var(--border-faint); }
  .specimen:last-child { border-bottom: none; }
  .sample { font-family: var(--font-display); font-weight: 300; color: var(--color-ink); white-space: nowrap; }
  .spec { font-size: 11px; color: var(--color-text-secondary); margin-left: auto; text-align: right; line-height: 1.5; flex: none; }
  .spec b { color: var(--color-violet); font-weight: 600; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="specimen"><span class="sample" style="font-size:64px;letter-spacing:-2.5px;line-height:1">Patient access</span><span class="spec"><b>display-lg</b><br>Noto Serif 300 · 64/72 · −2.5</span></div>
    <div class="specimen"><span class="sample" style="font-size:44px;letter-spacing:-1.92px;line-height:1">Without friction</span><span class="spec"><b>display-md</b><br>Noto Serif 300 · 48 · −1.92</span></div>
    <div class="specimen"><span class="sample" style="font-size:30px;letter-spacing:-0.96px;line-height:1">Exceptional experiences</span><span class="spec"><b>display-sm</b><br>Noto Serif 300 · 32 · −0.96</span></div>
  </div>
</body>
</html>
