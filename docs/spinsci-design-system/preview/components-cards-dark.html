<!DOCTYPE html>
<!-- @dsCard group="Components" name="Dark stat & testimonial cards" subtitle="Stat card + asymmetric quote card" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--color-surface); font-family: var(--font-ui); }
  .wrap { padding: 30px 32px; display: grid; grid-template-columns: 0.85fr 1.15fr; gap: 24px; align-items: stretch; }
  .stat { background: var(--color-ink); color: #fff; border-radius: var(--radius-lg); padding: 28px; }
  .num { font: 300 60px/1 var(--font-display); letter-spacing: -1.5px; }
  .rule { height: 1px; background: rgba(255,255,255,0.1); margin: 18px 0 12px; }
  .sub { font: 700 11px/1.5 var(--font-ui); letter-spacing: 0.8px; text-transform: uppercase; color: rgba(255,255,255,0.6); }
  .quote { background: var(--color-ink); color: #fff; border-radius: 16px 16px 32px 32px; padding: 28px 28px 0; display: flex; flex-direction: column; }
  .quote .q { font: 300 21px/1.5 var(--font-display); letter-spacing: -0.4px; }
  .attr { display: flex; gap: 8px; margin: 22px 0 28px; }
  .tag { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: var(--radius-sm); padding: 7px 12px; font: 400 12px/1 var(--font-ui); color: rgba(255,255,255,0.85); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="stat">
      <div class="num">400M+</div>
      <div class="rule"></div>
      <div class="sub">Patient interactions automated</div>
    </div>
    <div class="quote">
      <div class="q">"SpinSci took our average hold time from minutes to seconds — without touching our EHR workflows."</div>
      <div class="attr"><span class="tag">VP, Patient Access</span><span class="tag">Regional Health System</span></div>
    </div>
  </div>
</body>
</html>
