<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Elevation & shadows" subtitle="Ring shadows + modal drop" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--color-white); font-family: var(--font-ui); }
  .wrap { padding: 34px 32px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; align-items: center; }
  .item { text-align: center; }
  .card { height: 80px; background: #fff; border: 1px solid var(--border-hairline); border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--color-text-secondary); }
  .c1 { box-shadow: var(--shadow-card); }
  .c2 { box-shadow: var(--shadow-card-hover); }
  .c3 { box-shadow: var(--shadow-modal); border-color: var(--border-faint); }
  .tok { font-size: 12px; font-weight: 600; color: var(--color-text-primary); margin-top: 14px; }
  .val { font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="item"><div class="card c1">card</div><div class="tok">shadow-card</div><div class="val">ring · 0 0 0 4px @4%</div></div>
      <div class="item"><div class="card c2">hover</div><div class="tok">shadow-card-hover</div><div class="val">ring · 0 0 0 6px @8%</div></div>
      <div class="item"><div class="card c3">modal</div><div class="tok">shadow-modal</div><div class="val">0 24px 48px @12%</div></div>
    </div>
  </div>
</body>
</html>
