<!DOCTYPE html>
<!-- @dsCard group="Type" name="Body & UI type — Sora" subtitle="body-lg through caption" viewport="700x230" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--color-white); font-family: var(--font-ui); }
  .wrap { padding: 26px 32px; }
  .specimen { display: flex; align-items: baseline; gap: 18px; padding: 11px 0; border-bottom: 1px solid var(--border-faint); }
  .specimen:last-child { border-bottom: none; }
  .sample { font-family: var(--font-ui); color: var(--color-ink); }
  .spec { font-size: 11px; color: var(--color-text-secondary); margin-left: auto; text-align: right; line-height: 1.5; flex: none; }
  .spec b { color: var(--color-violet); font-weight: 600; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="specimen"><span class="sample" style="font-size:18px;font-weight:400">Lead paragraph — friction-free patient access.</span><span class="spec"><b>body-lg</b><br>Sora 400 · 18/26</span></div>
    <div class="specimen"><span class="sample" style="font-size:16px;font-weight:400">Standard body copy used across the interface.</span><span class="spec"><b>body-md</b><br>Sora 400 · 16/24</span></div>
    <div class="specimen"><span class="sample" style="font-size:14px;font-weight:400">Secondary body and navigation links.</span><span class="spec"><b>body-sm</b><br>Sora 400 · 14/20</span></div>
    <div class="specimen"><span class="sample" style="font-size:11px;font-weight:400;color:var(--color-text-secondary)">TAG / DATA LABEL CAPTION</span><span class="spec"><b>caption</b><br>Sora 400 · 11/16</span></div>
  </div>
</body>
</html>
